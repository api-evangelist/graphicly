name: Graphicly
description: Graphicly was a digital-comics and e-book distribution and self-publishing platform, founded
  around 2009 in Austin, Texas, that let independent creators and publishers convert their work and
  distribute it across major reading platforms including Amazon Kindle, Apple iBooks, Barnes & Noble Nook,
  and Google Play. Backed by 500 Startups (500 Global) among other investors, the company was acquired by
  Blurb in 2014 and its distribution service was subsequently discontinued. The graphicly.com domain no
  longer serves a live product, and the company exposes no public developer portal, documentation, or API
  surface. This profile is retained in the API Evangelist network for portfolio-graph and historical
  reference; enrichment found no live API, SDK, event, or security surface to harvest.
